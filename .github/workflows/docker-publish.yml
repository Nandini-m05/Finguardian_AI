name: Build and push backend image

# Builds the backend Docker image on GitHub's free runners and pushes it to
# Docker Hub as a PUBLIC image (free, unlimited). Cloud Run then deploys
# straight from Docker Hub, so nothing is stored in Google's paid registry.
#
# One-time setup - GitHub repo -> Settings -> Secrets and variables -> Actions:
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     Docker Hub -> Account settings -> Personal access tokens (Read & Write)
#
# The image contains code and the public FinBERT model only. Secrets (.env)
# are never copied in (see .dockerignore); they live in Cloud Run's settings.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "alembic/**"
      - "requirements.txt"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (torch + FinBERT make a large image)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finguardian-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/finguardian-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
